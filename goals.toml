# goals.toml — declared performance targets for cqlite (PRD addendum US-2).
#
# A goal MATCHES a result when every selector field present here equals the
# result's value (omitted selector = matches any). It is MET when
# "<metric> <op> <target>" holds. A goal with `regression_max_pct` instead
# judges against a baseline result rather than an absolute target.
#
# Targets below are DATA-GROUNDED from the 2026-06-16 baseline run (cqlite main@9054734).
# Each target has a one-line rationale citing the measured number and margin.
# `enforce = true` means CI gates on the goal (SPEC §14).

[[goal]]
name     = "basic scan decode throughput (S tier)"
metric   = "throughput.rows_per_sec"
op       = ">="
target   = 300000                 # measured 332,351 rows/s on 2026-06-16 (basic/S/lz4, main@9054734); target = floor to 300k (~10% below) as regression floor
workload = "read.full_scan"
schema   = "basic"
tier     = "S"
enforce  = false

[[goal]]
name     = "point lookup p99 latency"
metric   = "latency_us.p99"
op       = "<="
target   = 450000                 # measured p99=401,151 µs on 2026-06-16 (main@9054734); still a full-scan with residual filtering — no O(log n) partition seek yet (cqlite #755); target = ~450 ms (+~12% margin above measured)
workload = "read.point_lookup"
enforce  = false

# Memory goals — RETARGETED from dhat data (cqlite-perf #5, 2026-06-16).
# A full read.full_scan of the 100k-row basic S corpus measured:
#   live-heap high-water (dhat t-gmax) = 194 MB  ← the real bound
#   sysinfo peak_rss                   = 2108 MB ← ~11x inflated by mmap (cqlite
#                                                  #589) + allocator retention
# So the engine IS bounded (returns to ~0, no leak) but the bound is O(rows
# materialized), not corpus bytes — execute_streaming holds the whole result.
#
# Enforceable memory goal gates on LIVE HEAP, populated only when built with
# `--features dhat-heap` (NO-DATA on a normal run — run a single-workload dhat
# build to evaluate it).
[[goal]]
name     = "streaming scan live heap bounded (S tier)"
metric   = "custom.mem.live_heap_bytes"
op       = "<="
target   = 268435456              # 256 MB = 194 MB measured + ~30% margin
workload = "read.full_scan"
schema   = "basic"
tier     = "S"
enforce  = false                  # only has data under the dhat-heap build

# peak_rss kept as an INFORMATIONAL ceiling only — it counts reclaimable mmap +
# allocator pages, so it is not a fair "memory-bounded" gate. Loose bound just
# flags a gross blow-up; never enforce.
[[goal]]
name     = "streaming scan peak RSS (informational)"
metric   = "resource.peak_rss_bytes"
op       = "<="
target   = 3221225472             # 3 GB — observed ~2.1 GB; flag only if it balloons
workload = "read.full_scan"
enforce  = false

# NORTH-STAR (not a goal entry): live heap <= 128 MB at S tier. Unreachable while
# execute_streaming materializes the full result; requires upstream incremental
# streaming on the read path (cqlite #790; cf. the write-path merge #754).
# Tracked, not gated.

[[goal]]
name     = "write ingest throughput (WAL-on)"
metric   = "throughput.ops_per_sec"
op       = ">="
target   = 200                    # measured 215 ops/s at conc=1 (2026-06-16, main@9054734); fsync-per-write bound; regression floor = floor at ~10% below observed minimum
workload = "write.ingest"
enforce  = false

[[goal]]
name     = "write ingest throughput (WAL-off)"
metric   = "throughput.ops_per_sec"
op       = ">="
target   = 230000                 # measured 254,916 ops/s at conc=1 (2026-06-16, main@9054734); memtable-only path; regression floor = ~10% below observed minimum
workload = "write.ingest_waloff"
enforce  = false

[[goal]]
name     = "memtable flush throughput"
metric   = "custom.flush.mb_per_sec"
op       = ">="
target   = 95                     # measured 106.10 MB/s (2026-06-16, main@9054734); regression floor = ~10% below observed
workload = "write.flush"
enforce  = false

[[goal]]
name     = "memtable flush latency"
metric   = "custom.flush.latency_ms_mean"
op       = "<="
target   = 85                     # measured 75.40 ms mean (2026-06-16, main@9054734); ceiling = ~13% above observed to absorb I/O jitter
workload = "write.flush"
enforce  = false

[[goal]]
name     = "compaction read-amp reduction"
metric   = "custom.compaction.read_amp_after"
op       = "<="
target   = 1                      # measured read_amp_after=1 (2026-06-16, main@9054734); K SSTables merge to 1 — correct by definition of full compaction
workload = "write.compaction"
enforce  = false

[[goal]]
name     = "compaction cycle wall-time"
metric   = "custom.compaction.wall_ms_mean"
op       = "<="
target   = 400                    # measured 343.65 ms mean (2026-06-16, main@9054734); ceiling = ~16% above observed to absorb I/O jitter
workload = "write.compaction"
enforce  = false

[[goal]]
name     = "read p99 under write load (read_while_write)"
metric   = "custom.read.p99_us"
op       = "<="
target   = 275000                 # measured read.p99_us=239,871 µs at conc=8 (2026-06-16, main@9054734); ceiling = ~15% above observed
workload = "mixed.read_while_write"
enforce  = false

[[goal]]
name     = "open-loop writers keep up with target rate"
metric   = "custom.write.ops_per_sec"
op       = ">="
target   = 90000                  # measured write.ops_per_sec=99,470 at conc=8 (2026-06-16, main@9054734); target = 90% of 100k/s goal rate — intentional design contract
workload = "mixed.open_loop"
enforce  = false

[[goal]]
name     = "read p99 under open-loop write load"
metric   = "custom.read.p99_us"
op       = "<="
target   = 185000                 # measured read.p99_us=157,695 µs at conc=8 (2026-06-16, main@9054734); ceiling = ~17% above observed
workload = "mixed.open_loop"
enforce  = false

[[goal]]
name               = "scan throughput regression budget"
metric             = "throughput.rows_per_sec"
regression_max_pct = 10.0         # fail if >10% worse than baseline
workload           = "read.full_scan"
enforce            = false

# ── Phase 3 enforced regression gates (CI-blocking) ─────────────────────────
#
# These two goals gate CI via `scorecard --enforce`. They are BASELINE-RELATIVE
# (regression_max_pct), not absolute, because GitHub-hosted ubuntu-latest runners
# are noisy (~±10–15% run-to-run); a 30% budget absorbs that noise while still
# catching real regressions. The baseline is the prior `linux-baseline-master`
# artifact downloaded in the linux-baseline CI job; when no prior artifact exists
# (first run) both goals yield Status::NoData → not a failure.
#
# Measured 2026-06-16 on cqlite main@9054734, ubuntu-equivalent (macOS proxy):
#   read.full_scan   throughput.rows_per_sec ≈ 332,351 rows/s
#   read.point_lookup latency_us.p99         ≈ 401,151 µs

[[goal]]
name               = "scan throughput regression vs baseline"
metric             = "throughput.rows_per_sec"
regression_max_pct = 30.0         # GH runners are noisy; 30% budget absorbs ~±15% noise while catching real regressions; 2026-06-16 measured ~332,351 rows/s
workload           = "read.full_scan"
schema             = "basic"
tier               = "S"
enforce            = true

[[goal]]
name               = "point lookup p99 regression vs baseline"
metric             = "latency_us.p99"
regression_max_pct = 30.0         # GH runners are noisy; 30% budget absorbs ~±15% noise while catching real regressions; 2026-06-16 measured ~401,151 µs
workload           = "read.point_lookup"
enforce            = true

# ── Soak trend goals (T3, issue #32) ──────────────────────────────────────
#
# These judge a soak run against ITSELF: the runner's `--snapshot-interval`
# mode (#31) splits a long run into windows and derives `custom.trend.*`
# summaries comparing the last quartile of windows to the first (throughput
# retention, p99 drift ratio) plus an RSS slope over the whole run. Because
# the comparison is self-relative rather than an absolute number, these goals
# are valid on shared, noisy CI runners even though Reference C's "never
# compare across host signatures" rule forbids absolute cross-host
# comparisons (TEST_PLAN.md Reference C) — there is no cross-host comparison
# here, only a run against its own earlier windows. This is the same
# principle that lets T0's PR-vs-main micro-benches run on GH-hosted runners
# (perf-strategy.md §1, principle 5).
#
# The `custom.trend.*` keys only exist on a run started with
# `--snapshot-interval` (T3 soak runs, `soak.mixed` / `soak.ingest`, #33/#34).
# A normal T1/T2 run (smoke, nightly main-tracking, or any short CI run) has
# no soak `custom` keys at all, so these goals render `Status::NoData` there —
# NOT a failure — and `scorecard --enforce` continues to see only the
# existing T1 baseline-relative goals as enforceable on those runs.
#
# All four goals below are `enforce = false` PLACEHOLDERS: the calibration
# ladder (perf-strategy.md §1, principle 4) requires ≥3 measured weekly soak
# runs before a target is data-grounded. Until then these are informational —
# they show up in SCORECARD.md so trend values are visible on every soak run,
# but never gate CI. Calibration procedure (mirrors #19 → #23 for the T1
# gates):
#   1. Collect ≥3 weekly `soak.yml` runs (#34) and record their trend values.
#   2. Derive each target from the measured spread: retention floor =
#      measured − 3×stddev (min 0.90); drift ceiling = measured + margin;
#      slope ceiling = measured + 3×stddev with an absolute cap.
#   3. Replace the PLACEHOLDER target + comment below with the data-grounded
#      one, citing the runs, in a PR — same rationale-comment convention as
#      every other goal in this file.
#   4. Flip `enforce = true`. `scorecard --enforce` then turns a soak
#      regression into a red weekly run automatically.
#
# Follow-up issue template (file after #34 / soak.yml has accumulated the 3
# calibration runs above — do not file until that data exists):
#
#   gh issue create -R pmcfadin/cqlite-perf \
#     --title "Flip soak trend goals to enforce (calibrated from N weekly runs)" \
#     --body  "Part of epic #30, follow-up to #32. The soak trend goals in
#   goals.toml (throughput_retention, read_p99_drift_ratio, rss_slope_mb_per_h,
#   write.ingest throughput_retention) have been informational (enforce =
#   false) since #32. soak.yml (#34) has now run weekly for N>=3 weeks with
#   stable trend values: <cite run dates + measured values here>. Recalibrate
#   each PLACEHOLDER target from the measured spread per the calibration
#   procedure in goals.toml's soak-trend-goals header comment, flip
#   enforce = true, and update perf-strategy.md's T3 status."

[[goal]]
name     = "soak mixed: throughput retention (last/first quartile)"
metric   = "custom.trend.throughput_retention"
op       = ">="
target   = 0.95            # PLACEHOLDER — calibrate from >=3 weekly runs before enforcing
workload = "mixed.read_while_write"
enforce  = false

[[goal]]
name     = "soak mixed: reader p99 drift (last/first quartile)"
metric   = "custom.trend.read_p99_drift_ratio"
op       = "<="
target   = 1.25            # PLACEHOLDER — the #1143 class of regression shows up here; key matches the shipped cohort label "read" (#31)
workload = "mixed.read_while_write"
enforce  = false

[[goal]]
name     = "soak mixed: RSS slope"
metric   = "custom.trend.rss_slope_mb_per_h"
op       = "<="
target   = 16              # PLACEHOLDER — a true leak shows a persistent positive slope
workload = "mixed.read_while_write"
enforce  = false

[[goal]]
name     = "soak ingest: throughput retention under sustained WAL-on ingest"
metric   = "custom.trend.throughput_retention"
op       = ">="
target   = 0.90            # PLACEHOLDER — ingest decay is the compaction-debt signal (upstream pmcfadin/cqlite#905)
workload = "write.ingest"
enforce  = false
