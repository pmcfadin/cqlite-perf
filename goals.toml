# goals.toml — declared performance targets for cqlite (PRD addendum US-2).
#
# A goal MATCHES a result when every selector field present here equals the
# result's value (omitted selector = matches any). It is MET when
# "<metric> <op> <target>" holds. A goal with `regression_max_pct` instead
# judges against a baseline result rather than an absolute target.
#
# Targets below are SEEDED PLACEHOLDERS. The cqlite dev team owns calibrating
# them — writing down the number is the US-2 deliverable. `enforce = true`
# means CI gates on the goal (SPEC §14).

[[goal]]
name     = "basic scan decode throughput (S tier)"
metric   = "throughput.rows_per_sec"
op       = ">="
target   = 1000000                # 1M rows/sec — PLACEHOLDER, calibrate
workload = "read.full_scan"
schema   = "basic"
tier     = "S"
enforce  = false

[[goal]]
name     = "point lookup p99 latency"
metric   = "latency_us.p99"
op       = "<="
target   = 500                    # 500 µs — PLACEHOLDER, calibrate
workload = "read.point_lookup"
enforce  = false

# Memory goals — RETARGETED from dhat data (cqlite-perf #5, 2026-06-16).
# A full read.full_scan of the 100k-row basic S corpus measured:
#   live-heap high-water (dhat t-gmax) = 194 MB  ← the real bound
#   sysinfo peak_rss                   = 2108 MB ← ~11x inflated by mmap (cqlite
#                                                  #589) + allocator retention
# So the engine IS bounded (returns to ~0, no leak) but the bound is O(rows
# materialized), not corpus bytes — execute_streaming holds the whole result.
#
# Enforceable memory goal gates on LIVE HEAP, populated only when built with
# `--features dhat-heap` (NO-DATA on a normal run — run a single-workload dhat
# build to evaluate it).
[[goal]]
name     = "streaming scan live heap bounded (S tier)"
metric   = "custom.mem.live_heap_bytes"
op       = "<="
target   = 268435456              # 256 MB = 194 MB measured + ~30% margin
workload = "read.full_scan"
schema   = "basic"
tier     = "S"
enforce  = false                  # only has data under the dhat-heap build

# peak_rss kept as an INFORMATIONAL ceiling only — it counts reclaimable mmap +
# allocator pages, so it is not a fair "memory-bounded" gate. Loose bound just
# flags a gross blow-up; never enforce.
[[goal]]
name     = "streaming scan peak RSS (informational)"
metric   = "resource.peak_rss_bytes"
op       = "<="
target   = 3221225472             # 3 GB — observed ~2.1 GB; flag only if it balloons
workload = "read.full_scan"
enforce  = false

# NORTH-STAR (not a goal entry): live heap <= 128 MB at S tier. Unreachable while
# execute_streaming materializes the full result; requires upstream incremental
# streaming on the read path (cqlite #790; cf. the write-path merge #754).
# Tracked, not gated.

[[goal]]
name     = "write ingest throughput (WAL-on)"
metric   = "throughput.ops_per_sec"
op       = ">="
target   = 250                    # PLACEHOLDER, calibrate — fsync-per-write bound
workload = "write.ingest"
enforce  = false

[[goal]]
name     = "write ingest throughput (WAL-off)"
metric   = "throughput.ops_per_sec"
op       = ">="
target   = 200000                 # PLACEHOLDER, calibrate — memtable-only path
workload = "write.ingest_waloff"
enforce  = false

[[goal]]
name     = "memtable flush throughput"
metric   = "custom.flush.mb_per_sec"
op       = ">="
target   = 100                    # MB/sec — PLACEHOLDER, calibrate
workload = "write.flush"
enforce  = false

[[goal]]
name     = "memtable flush latency"
metric   = "custom.flush.latency_ms_mean"
op       = "<="
target   = 100                    # ms per 8 MB flush — PLACEHOLDER, calibrate
workload = "write.flush"
enforce  = false

[[goal]]
name     = "compaction read-amp reduction"
metric   = "custom.compaction.read_amp_after"
op       = "<="
target   = 1                      # K SSTables merge to 1 — PLACEHOLDER, calibrate
workload = "write.compaction"
enforce  = false

[[goal]]
name     = "compaction cycle wall-time"
metric   = "custom.compaction.wall_ms_mean"
op       = "<="
target   = 500                    # ms to merge K small SSTables — PLACEHOLDER
workload = "write.compaction"
enforce  = false

[[goal]]
name     = "read p99 under write load (read_while_write)"
metric   = "custom.read.p99_us"
op       = "<="
target   = 500000                 # 500 ms full-scan p99 while writers run — PLACEHOLDER
workload = "mixed.read_while_write"
enforce  = false

[[goal]]
name     = "open-loop writers keep up with target rate"
metric   = "custom.write.ops_per_sec"
op       = ">="
target   = 90000                  # achieved ≥ 90% of the 100k/sec target — PLACEHOLDER
workload = "mixed.open_loop"
enforce  = false

[[goal]]
name     = "read p99 under open-loop write load"
metric   = "custom.read.p99_us"
op       = "<="
target   = 500000                 # 500 ms full-scan p99 — PLACEHOLDER
workload = "mixed.open_loop"
enforce  = false

[[goal]]
name               = "scan throughput regression budget"
metric             = "throughput.rows_per_sec"
regression_max_pct = 10.0         # fail if >10% worse than baseline
workload           = "read.full_scan"
enforce            = false
