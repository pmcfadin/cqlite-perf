[package]
name = "cqlite-perf"
version = "0.1.0"
edition = "2021"
publish = false
description = "External macro-benchmark harness for CQLite (read/write/mixed suites)"

[dependencies]
# Standalone git-tag dependency on cqlite — no local paths, fully reproducible.
# `write-support` is non-default and required by the write suite; the defaults
# (all-compression, state_machine) cover the read path.
# INTERIM: pinned to a main commit to validate the #788 (clustering bounds) and
# #790 (streaming materialization) fixes ahead of a tagged release. Re-pin to
# `tag = "v0.12.0"` once it's cut (see CLAUDE.md flow).
cqlite-core = { git = "https://github.com/pmcfadin/cqlite.git", rev = "9054734eec1bb9750cacc54de723311b7edd7663", features = ["write-support", "cli-helpers"] }

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
hdrhistogram = "7"               # latency percentiles, coordinated-omission aware
rand = "0.8"
rand_distr = "0.4"               # Zipfian distribution
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
sysinfo = "0.30"                 # RSS / CPU sampling
sha2 = "0.10"                    # dataset checksums
tempfile = "3"                   # scratch dirs for write/volume runs
dhat = { version = "0.3", optional = true }  # heap profiling (issue #4); slows the
                                 # whole binary via a global allocator wrapper, so
                                 # it's gated behind the `dhat-heap` feature.

[features]
# Swap the global allocator to dhat's and dump dhat-heap.json on exit. Build with
# `--features dhat-heap` for a single focused workload, e.g. read.full_scan.
dhat-heap = ["dep:dhat"]

[dev-dependencies]
criterion = "0.5"                # optional shared bench helpers

[profile.release]
debug = true                     # keep symbols for flamegraphs (Phase 3)
lto = "thin"
codegen-units = 1
