# ci.yml — cqlite-perf CI workflow (W4-B, issue #8)
#
# Triggers:
#   • pull_request to master  — correctness gate on every PR
#   • push to master          — post-merge gate + Linux baseline recording
#   • paths: Cargo.toml / Cargo.lock — fires on engine-version bumps (cqlite-core
#     rev/tag changes), catching regressions introduced by a new engine pin
#
# Corpus provisioning strategy (cache-first with gen-as-fallback, SHA256-keyed):
#   The committed datasets/manifests/*.json files each contain a sha256 field over
#   the corpus SSTable Data.db files. The cache key is derived from the *content*
#   of ALL manifests (hashFiles), not from a tag or dataset name — so any manifest
#   change (new corpus, re-generated data, content drift) busts the cache and
#   forces a fresh generation. On a cache miss, `scripts/gen-corpus.sh`
#   regenerates the S-tier corpora from Cassandra 5.0 in Docker.
#
#   `cqlite-perf datasets --check` (SHA256 of each present corpus's *-Data.db vs
#   the committed manifest) is a HARD content-addressing gate. Verified in CI: a
#   fresh gen on ubuntu-latest reproduces the committed SHA exactly (`3 ok, 0
#   bad`). It exits non-zero only on a real mismatch (`bad`); corpora the workflow
#   does not generate (other codecs) are reported `missing` and tolerated.
#
# Correctness gate (THE hard gate):
#   `cqlite-perf validate` checks known-good ROW COUNTS for every query in
#   TEST_PLAN.md Reference B. A non-zero exit (any mismatch) fails the build.
#   Perf jobs do NOT run if it fails.
#
# Linux baseline:
#   A short `read.full_scan` + `read.point_lookup` run (10 s + 5 s warmup, 1
#   trial) records a real Linux throughput/latency number on the ubuntu-latest
#   runner (bare GitHub-hosted x86-64 — not virtualized Docker-on-macOS).
#   Results are uploaded as a build artifact labeled `linux-baseline-master`
#   (on master pushes) and kept for 90 days.
#
# Regression gate (issue #39 fix — SAME-RUNNER comparison):
#   On PRs, the enforced regression gate re-measures `master` in the SAME job,
#   on the SAME runner (via a git worktree), immediately after measuring the
#   PR. This mirrors the upstream engine's own perf-regression.yml pattern
#   (PR-vs-main, same runner) and is machine-invariant by construction.
#   The PREVIOUS design compared the PR's runner against a `linux-baseline-
#   master` artifact recorded on a DIFFERENT runner from a prior push — on
#   GitHub's heterogeneous fleet this produced spurious ~50-60% "regressions"
#   from pure hardware variance (cqlite-perf#39, hit PRs #38 and #45, both
#   docs/scripts-only changes with zero possible perf impact). The download-
#   artifact comparison is kept below, but demoted to INFORMATIONAL ONLY
#   (never gates) — it's useful trend context but spans host signatures,
#   which TEST_PLAN.md Reference C says never to gate on.

name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    # Also fires on engine-version bumps pushed to master — Cargo.toml contains
    # the cqlite-core git rev/tag; Cargo.lock contains the resolved commit hash.
    # PRs that bump the engine are caught by the pull_request trigger above.

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: correctness-gate
  #   Builds the harness, provisions the S-tier corpus, and runs `validate`.
  #   MUST pass before any perf work proceeds.
  # ─────────────────────────────────────────────────────────────────────────────
  correctness-gate:
    name: Correctness gate (validate)
    runs-on: ubuntu-latest

    # gen-corpus.sh manages its own Docker containers (docker run -d --name ...).
    # The ubuntu-latest runner has Docker installed; no service container needed.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Rust toolchain + build cache ─────────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - name: Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Build release binary
        run: cargo build --release

      # ── Corpus provisioning (cache-first, SHA256-keyed) ──────────────────────
      #
      # Cache key is the SHA256 of the manifests directory contents, NOT a tag.
      # If a manifest changes (new corpus, regenerated data), the cache busts and
      # we regenerate. After restore we always re-verify with `datasets --check`.
      - name: Restore corpus cache
        id: corpus-cache
        uses: actions/cache@v4
        with:
          path: datasets/
          key: corpus-${{ runner.os }}-${{ hashFiles('datasets/manifests/**') }}
          # No restore-keys: a partial corpus is worse than no corpus (the cache
          # might contain data for old manifests that no longer match SHA256).

      - name: Generate corpora (cache miss only)
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: |
          # gen-corpus.sh requires Docker (present on ubuntu-latest).
          # Generate only the S-tier corpora that validate checks:
          #   read-basic-S-lz4, read-wide_rows-S-lz4, read-collections-S-lz4
          bash scripts/gen-corpus.sh --tier S --codec lz4 --schema basic
          bash scripts/gen-corpus.sh --tier S --codec lz4 --schema wide_rows
          bash scripts/gen-corpus.sh --tier S --codec lz4 --schema collections

      - name: Verify corpus SHA256 against manifests
        # Content-addressing gate: SHA256 of each present corpus's *-Data.db vs
        # the committed manifest. `datasets --check` exits non-zero ONLY on a
        # mismatch (`bad`); corpora the workflow doesn't generate (other codecs)
        # are reported `missing` and do NOT fail. Verified in CI: a fresh
        # gen-corpus.sh run on ubuntu-latest reproduces the committed SHA exactly
        # (`3 ok, 0 bad`), so this is a real reproducibility assertion, not a
        # cache-only one. Row-count correctness is asserted separately by
        # `validate` below.
        run: ./target/release/cqlite-perf datasets --check

      # ── Correctness gate (HARD) ────────────────────────────────────────────────
      - name: Run correctness gate (cqlite-perf validate)
        # THE gate: known-good row counts (TEST_PLAN.md Reference B). A non-zero
        # exit (any row-count mismatch) fails the build. Robust to byte-level /
        # timestamp differences in freshly-generated corpora.
        run: ./target/release/cqlite-perf validate

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: linux-baseline
  #   Short perf smoke on the real ubuntu-latest Linux runner. Runs only after
  #   the correctness gate passes. Uploads results as a build artifact and
  #   attempts a cross-version diff against the previously recorded baseline.
  # ─────────────────────────────────────────────────────────────────────────────
  linux-baseline:
    name: Linux perf smoke + baseline
    runs-on: ubuntu-latest
    needs: correctness-gate
    # Run on push to master (record authoritative Linux baseline) and on PRs
    # (smoke only — artifact is labeled with the PR number for comparison).
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: read   # required for cross-run gh run download

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - name: Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Build release binary
        run: cargo build --release

      - name: Restore corpus cache
        id: corpus-cache
        uses: actions/cache@v4
        with:
          path: datasets/
          key: corpus-${{ runner.os }}-${{ hashFiles('datasets/manifests/**') }}

      - name: Generate corpora (cache miss only)
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/gen-corpus.sh --tier S --codec lz4 --schema basic
          bash scripts/gen-corpus.sh --tier S --codec lz4 --schema wide_rows
          bash scripts/gen-corpus.sh --tier S --codec lz4 --schema collections

      - name: Verify corpus SHA256 against manifests
        # Same content-addressing gate as the correctness-gate job (exits non-zero
        # only on a SHA mismatch; missing codecs are tolerated).
        run: ./target/release/cqlite-perf datasets --check

      # ── Short read smoke (Linux baseline numbers) ─────────────────────────────
      # Duration: 10s + 5s warmup, 1 trial — short enough for CI, long enough to
      # get a stable throughput reading. The ubuntu-latest runner is real x86-64
      # (not virtualized), so these numbers ARE the authoritative Linux baseline.
      - name: Run perf smoke (read.full_scan)
        run: |
          mkdir -p reports/linux-baseline
          ./target/release/cqlite-perf run \
            --workload read.full_scan \
            --duration 10s \
            --warmup 5s \
            --trials 1 \
            --out reports/linux-baseline

      - name: Run perf smoke (read.point_lookup)
        run: |
          ./target/release/cqlite-perf run \
            --workload read.point_lookup \
            --duration 10s \
            --warmup 5s \
            --trials 1 \
            --out reports/linux-baseline

      # ── Same-runner master build + smoke (PR only) — THE regression gate ─────
      # Builds and measures `origin/master` in a separate git worktree, on this
      # SAME runner, right after measuring the PR above. This is what makes the
      # comparison machine-invariant (issue #39): both numbers come from
      # identical hardware in the same job, not from two different runners
      # picked from GitHub's heterogeneous fleet on two different days.
      #
      # The worktree shares this job's already-warm ~/.cargo/registry (global,
      # unaffected by cwd) so master's build only redoes compilation, not
      # dependency fetch. Its own target/ is NOT cached (deliberately — the
      # cache above is for the PR's own build in the main checkout; caching
      # target/ across the branch switch here would carry incremental-
      # compilation state between two different source trees, same caution
      # the upstream engine's perf-regression.yml documents for its own
      # PR-vs-main pattern). The corpus DATA is COPIED (not symlinked) into
      # the worktree — a symlink reproduced cleanly in local testing but hit
      # an unreproducible checksum mismatch on the actual GitHub runner (an
      # earlier version of this step used `ln -s`; see git history on this
      # comment block). The S-tier corpora are small (a few MB each,
      # comfortably cheap to duplicate for a PR job), and a real copy removes
      # an entire class of shared-state ambiguity between two builds reading
      # the same underlying files — worth the small disk/time cost for a gate
      # this workflow depends on being trustworthy.
      #
      # `datasets/manifests/*.json` is git-tracked (see .gitignore), so the
      # worktree checkout already has a correct, real `datasets/manifests/`
      # dir from the git commit being measured — only the gitignored corpus
      # data subdirs need copying in.
      - name: Build + smoke master (same runner, PR only)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin master --depth=1
          git worktree add /tmp/master-checkout FETCH_HEAD
          for d in "$GITHUB_WORKSPACE"/datasets/*/; do
            name=$(basename "$d")
            [[ "$name" == "manifests" ]] && continue
            cp -r "$d" "/tmp/master-checkout/datasets/$name"
          done
          # TEMPORARY diagnostics (issue #39 follow-up): the copy is failing a
          # checksum check on the actual runner that never reproduces locally.
          # Compare file listing + hash directly so the next run gives a
          # concrete answer instead of another guess. Remove once root-caused.
          echo "::group::diagnostic: source vs copied read-basic-S-lz4"
          echo "--- source find (sorted) ---"
          find "$GITHUB_WORKSPACE/datasets/read-basic-S-lz4" -type f | sort
          echo "--- copy find (sorted) ---"
          find /tmp/master-checkout/datasets/read-basic-S-lz4 -type f | sort
          echo "--- source sha256sum of *-Data.db (sorted) ---"
          find "$GITHUB_WORKSPACE/datasets/read-basic-S-lz4" -name '*-Data.db' | sort | xargs -r sha256sum
          echo "--- copy sha256sum of *-Data.db (sorted) ---"
          find /tmp/master-checkout/datasets/read-basic-S-lz4 -name '*-Data.db' | sort | xargs -r sha256sum
          echo "::endgroup::"
          (
            cd /tmp/master-checkout
            cargo build --release
            echo "::group::diagnostic: datasets --check from the worktree, post-build"
            ./target/release/cqlite-perf datasets --check || true
            echo "::endgroup::"
            mkdir -p reports/master-same-runner
            ./target/release/cqlite-perf run \
              --workload read.full_scan --duration 10s --warmup 5s --trials 1 \
              --out reports/master-same-runner
            ./target/release/cqlite-perf run \
              --workload read.point_lookup --duration 10s --warmup 5s --trials 1 \
              --out reports/master-same-runner
          )
          cp -r /tmp/master-checkout/reports/master-same-runner "$GITHUB_WORKSPACE/reports/"

      # ── Regression gate (enforced, same-runner PR-vs-master) ──────────────────
      # Uses scorecard --enforce to fail the job if any enforced goal regresses
      # beyond its budget, judged against master measured on THIS SAME runner
      # (the step above) — not a cross-run artifact. Both smoke workloads
      # append to the same timestamped results.jsonl (tail -1 finds it).
      #
      # A missing/empty results.jsonl here means the master build step above
      # is broken (it always runs in this same job on pull_request events, so
      # there is no legitimate "no data yet" case the way a cross-run artifact
      # could be absent) — fail LOUDLY rather than silently skip, so a
      # regression in the gate itself can't hide behind a green check the way
      # the "ln -s onto an existing directory" bug did during #39's fix.
      - name: Regression gate (scorecard --enforce vs master, same runner)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          CURRENT=$(find reports/linux-baseline -name 'results.jsonl' | sort | tail -1)
          BASELINE=$(find reports/master-same-runner -name 'results.jsonl' | sort | tail -1)
          if [[ -z "$CURRENT" || -z "$BASELINE" ]]; then
            echo "::error::results.jsonl missing (current='$CURRENT' baseline='$BASELINE') — the master build/smoke step is broken, not a legitimate no-data case."
            exit 1
          fi
          if [[ $(wc -l < "$CURRENT") -eq 0 || $(wc -l < "$BASELINE") -eq 0 ]]; then
            echo "::error::results.jsonl exists but is empty (current has $(wc -l < "$CURRENT") lines, baseline has $(wc -l < "$BASELINE")) — every smoke workload errored out; check the 'Build + smoke master' and 'Run perf smoke' step logs."
            exit 1
          fi
          echo "Regression gate: current(PR)=$CURRENT  baseline(master, same runner)=$BASELINE"
          # --out is omitted: scorecard writes SCORECARD.md next to --results by default.
          ./target/release/cqlite-perf scorecard \
            --enforce \
            --baseline "$BASELINE" \
            --results "$CURRENT" \
            --goals goals.toml

      # ── Download prior baseline (INFORMATIONAL ONLY — does not gate) ─────────
      # This artifact was recorded on a DIFFERENT runner on a prior push, so per
      # TEST_PLAN.md Reference C ("never compare across host signatures") it is
      # never used to gate anything (see the regression gate above, which uses
      # the same-runner master build instead). Kept purely for trend visibility
      # in the job log — how does this PR's number compare to the historical
      # absolute baseline, informationally.
      - name: Download previous Linux baseline (latest master run)
        id: prev-baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list --workflow=ci.yml --branch master --status success -L 10 \
            --json databaseId -q '.[].databaseId' \
            | grep -v "^${{ github.run_id }}$" | head -1 || true)
          if [[ -z "${RUN_ID:-}" ]]; then
            echo "No prior master baseline run found; skipping regression gate."
            echo "found=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mkdir -p reports/prior-linux-baseline
          if gh run download "$RUN_ID" -n linux-baseline-master -D reports/prior-linux-baseline; then
            echo "Downloaded baseline from master run $RUN_ID"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No linux-baseline-master artifact on run $RUN_ID; skipping regression gate."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare against prior baseline
        if: steps.prev-baseline.outputs.found == 'true'
        run: |
          echo "=== Cross-version comparison ==="
          echo "Current commit: ${{ github.sha }}"
          echo ""
          echo "--- current baseline ---"
          # Find the most recent results.jsonl in reports/linux-baseline/
          CURRENT=$(find reports/linux-baseline -name 'results.jsonl' | sort | tail -1)
          if [[ -n "$CURRENT" ]]; then
            echo "Workload results (ops/sec, p99 µs):"
            python3 -c "
          import json, sys
          with open('$CURRENT') as f:
              for line in f:
                  line = line.strip()
                  if not line: continue
                  r = json.loads(line)
                  name = r.get('workload', '?')
                  ops = r.get('throughput', {}).get('ops_per_sec', 0)
                  p99 = r.get('latency_us', {}).get('p99', 0)
                  print(f'  {name}: {ops:.0f} ops/sec  p99={p99} µs')
          "
          fi
          echo ""
          echo "--- prior baseline ---"
          PRIOR=$(find reports/prior-linux-baseline -name 'results.jsonl' | sort | tail -1)
          if [[ -n "$PRIOR" ]]; then
            python3 -c "
          import json, sys
          with open('$PRIOR') as f:
              for line in f:
                  line = line.strip()
                  if not line: continue
                  r = json.loads(line)
                  name = r.get('workload', '?')
                  ops = r.get('throughput', {}).get('ops_per_sec', 0)
                  p99 = r.get('latency_us', {}).get('p99', 0)
                  print(f'  {name}: {ops:.0f} ops/sec  p99={p99} µs')
          "
          fi

      # ── Upload baseline artifact ──────────────────────────────────────────────
      # On master pushes, upload as the "authoritative" baseline (name: linux-baseline-master).
      # On PRs, upload with the PR number so comparisons are unambiguous.
      - name: Upload Linux baseline artifact (master push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: linux-baseline-master
          path: reports/linux-baseline/
          retention-days: 90

      - name: Upload Linux baseline artifact (PR smoke)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: linux-baseline-pr-${{ github.event.number }}
          # Both dirs included so a red regression gate is debuggable from the
          # artifact alone: the PR's own numbers AND the same-runner master
          # numbers it was actually judged against.
          path: |
            reports/linux-baseline/
            reports/master-same-runner/
          retention-days: 30
